# Reprints the investor deck's PDFs, public and full, from zode.org once each
# production deploy is live, and uploads them to the private Blob store that
# /deck/download serves them from (scripts/make-deck-pdf.mjs).
#
# Vercel reports each deploy to GitHub as a deployment; this runs when one to
# Production succeeds. It prints zode.org rather than the deployment's own
# address, which Vercel's deployment protection keeps behind a login.
#
# Repository secrets:
#   DECK_ROOM_TOKEN        a live data room share link's token, for the full deck
#   BLOB_READ_WRITE_TOKEN  the Vercel project's private Blob store
name: Deck PDF

on:
  deployment_status:
  workflow_dispatch:

# A newer deploy's print replaces an older one still running.
concurrency:
  group: deck-pdf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  print:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run deck:pdf -- --upload
        env:
          DECK_URL: https://zode.org/deck
          DECK_ROOM_TOKEN: ${{ secrets.DECK_ROOM_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
